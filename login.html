<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportSpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="auth-wrap">

    <div class="auth-card">

        <div class="auth-top">
            <div class="auth-logo">
                <i class="ti ti-tournament"></i>
                SportSpace
            </div>

            <p class="auth-desc">
                Platform booking lapangan olahraga #1 di Yogyakarta
            </p>
        </div>

        <div class="tab-row">
            <button class="tab-btn active" id="btn-login">Masuk</button>
            <button class="tab-btn" id="btn-register">Daftar</button>
        </div>

        <!-- PANEL LOGIN -->
        <div class="tab-panel active" id="panel-login">

            <form id="form-login">

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-icon">
                        <i class="ti ti-mail"></i>
                        <input type="email" name="email" id="loginEmail" placeholder="email@kamu.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="ti ti-lock"></i>
                        <input type="password" name="password" id="loginPassword" placeholder="••••••••">
                    </div>
                </div>

                <!-- Pesan error login -->
                <div id="error-login" style="color:red;font-size:13px;margin-bottom:10px;display:none;"></div>

                <button type="submit" class="btn btn-primary btn-full">
                    Masuk
                    <i class="ti ti-arrow-right"></i>
                </button>

            </form>

            <div class="divider">
                <span>atau masuk sebagai</span>
            </div>

            <div class="role-buttons">
                <button class="btn btn-outline" onclick="window.location.href='dashboard-admin.html'">
                    <i class="ti ti-shield"></i>
                    Admin
                </button>

                <button class="btn btn-outline" onclick="window.location.href='dashboard-owner.html'">
                    <i class="ti ti-building"></i>
                    Pemilik GOR
                </button>
            </div>

        </div>

        <!-- PANEL REGISTER -->
        <div class="tab-panel" id="panel-register">

            <form id="form-register">

                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <div class="input-icon">
                        <i class="ti ti-user"></i>
                        <input type="text" name="nama" id="regNama" placeholder="Nama kamu">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <div class="input-icon">
                        <i class="ti ti-mail"></i>
                        <input type="email" name="email" id="regEmail" placeholder="email@kamu.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="ti ti-lock"></i>
                        <input type="password" name="password" id="regPassword" placeholder="Minimal 8 karakter">
                    </div>
                </div>

                <!-- Pesan error register -->
                <div id="error-register" style="color:red;font-size:13px;margin-bottom:10px;display:none;"></div>

                <button type="submit" class="btn btn-primary btn-full">
                    Buat Akun
                    <i class="ti ti-arrow-right"></i>
                </button>

            </form>

        </div>

    </div>

</div>

<script>
// ── Tab switcher ──────────────────────────────────
const loginBtn    = document.getElementById("btn-login");
const registerBtn = document.getElementById("btn-register");
const loginPanel  = document.getElementById("panel-login");
const registerPanel = document.getElementById("panel-register");

loginBtn.addEventListener("click", () => {
    loginBtn.classList.add("active");
    registerBtn.classList.remove("active");
    loginPanel.classList.add("active");
    registerPanel.classList.remove("active");
});

registerBtn.addEventListener("click", () => {
    registerBtn.classList.add("active");
    loginBtn.classList.remove("active");
    registerPanel.classList.add("active");
    loginPanel.classList.remove("active");
});

// ── Form Login ────────────────────────────────────
document.getElementById('form-login').addEventListener('submit', function(e) {
    e.preventDefault();

    const email    = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('error-login');

    errorDiv.style.display = 'none';

    fetch('login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            window.location.href = data.redirect;
        } else {
            errorDiv.style.display = 'block';
            errorDiv.textContent = data.message;
        }
    })
    .catch(() => {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Terjadi kesalahan, coba lagi.';
    });
});

// ── Form Register ─────────────────────────────────
document.getElementById('form-register').addEventListener('submit', function(e) {
    e.preventDefault();

    const nama     = document.getElementById('regNama').value;
    const email    = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const errorDiv = document.getElementById('error-register');

    errorDiv.style.display = 'none';

    fetch('register.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `nama=${encodeURIComponent(nama)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            window.location.href = data.redirect;
        } else {
            errorDiv.style.display = 'block';
            errorDiv.textContent = data.message;
        }
    })
    .catch(() => {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Terjadi kesalahan, coba lagi.';
    });
});
</script>

</body>
</html>
