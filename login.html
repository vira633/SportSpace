<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportSpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
</head>

<body>

    <div class="auth-wrap">

        <div class="auth-card">

            <div class="auth-top">
                <div class="auth-logo">
                    <i class="ti ti-bowling"></i>
                    SportSpace
                </div>
                <p class="auth-desc">
                    Platform booking lapangan olahraga #1 di Yogyakarta
                </p>
            </div>

            <div class="tab-row">
                <button class="tab-btn active" id="btn-login">Masuk</button>
                <button class="tab-btn" id="btn-register">Daftar</button>
            </div>

            <div class="tab-panel active" id="panel-login">
                <form id="form-login">
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-icon">
                            <i class="ti ti-mail"></i>
                            <input type="email" name="email" id="loginEmail" placeholder="email@kamu.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-icon">
                            <i class="ti ti-lock"></i>
                            <input type="password" name="password" id="loginPassword" placeholder="••••••••">
                        </div>
                    </div>

                    <div id="error-login" style="color:red;font-size:13px;margin-bottom:10px;display:none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">
                        Masuk
                        <i class="ti ti-arrow-right"></i>
                    </button>
                </form>

                <div class="divider">
                    <span>atau masuk sebagai</span>
                </div>

                <div class="role-buttons">
                    <button class="btn btn-outline" onclick="window.location.href='login-owner.html'"
                        style="width: 100%;">
                        <i class="ti ti-building"></i>
                        Pemilik GOR
                    </button>
                </div>
            </div>

            <div class="tab-panel" id="panel-register">
                <form id="form-register">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <div class="input-icon">
                            <i class="ti ti-user"></i>
                            <input type="text" name="nama" id="regNama" placeholder="Nama kamu">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-icon">
                            <i class="ti ti-mail"></i>
                            <input type="email" name="email" id="regEmail" placeholder="email@kamu.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-icon">
                            <i class="ti ti-lock"></i>
                            <input type="password" name="password" id="regPassword" placeholder="Minimal 8 karakter">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Telepon</label>
                        <div class="input-icon">
                            <i class="ti ti-phone"></i>
                            <input type="text" name="telepon" id="regtelepon" placeholder="08xxxxxxxxxx" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Daftar Sebagai</label>
                        <div class="input-icon">
                            <i class="ti ti-users"></i>
                            <select name="role" id="regRole">
                                <option value="user">User</option>
                                <option value="owner">Pemilik GOR (Owner)</option>
                            </select>
                        </div>
                    </div>

                    <div id="error-register" style="color:red;font-size:13px;margin-bottom:10px;display:none;"></div>

                    <button type="submit" class="btn btn-primary btn-full">
                        Buat Akun
                        <i class="ti ti-arrow-right"></i>
                    </button>
                </form>
            </div>

        </div>
    </div>

    <script>
        // Tab switcher 
        const loginBtn = document.getElementById("btn-login");
        const registerBtn = document.getElementById("btn-register");
        const loginPanel = document.getElementById("panel-login");
        const registerPanel = document.getElementById("panel-register");

        function aktifkanTabLogin() {
            loginBtn.classList.add("active");
            registerBtn.classList.remove("active");
            loginPanel.classList.add("active");
            registerPanel.classList.remove("active");
        }

        function aktifkanTabRegister() {
            registerBtn.classList.add("active");
            loginBtn.classList.remove("active");
            registerPanel.classList.add("active");
            loginPanel.classList.remove("active");
        }

        loginBtn.addEventListener("click", aktifkanTabLogin);
        registerBtn.addEventListener("click", aktifkanTabRegister);

        // Ajax Login
        document.getElementById('form-login').addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('error-login');
            errorDiv.style.display = 'none';

            fetch('login.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        window.location.href = data.redirect;
                    } else {
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = data.message;
                    }
                });
        });

        // Ajax Register
        document.getElementById('form-register').addEventListener('submit', function (e) {
            e.preventDefault();
            const nama = document.getElementById('regNama').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const telepon = document.getElementById('regtelepon').value;
            const role = document.getElementById('regRole').value;
            const errorDiv = document.getElementById('error-register');
            errorDiv.style.display = 'none';

            fetch('register.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: `nama=${encodeURIComponent(nama)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}&telepon=${encodeURIComponent(telepon)}&role=${encodeURIComponent(role)}`
            })
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success') {
                        window.location.href = data.redirect;
                    } else {
                        errorDiv.style.display = 'block';
                        errorDiv.textContent = data.message;
                    }
                })

                });

            if (window.location.hash === '#register') {
                aktifkanTabRegister();
            }
        });
    </script>
</body>

</html>
