<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Booking — SportSpace</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <style>
    :root {
      --green: #10b981; --green-light: #f0faf6; --white: #ffffff;
      --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-400: #9ca3af;
      --gray-900: #111827; --amber: #f59e0b; --amber-light: #fffbeb;
      --red: #ef4444; --red-light: #fef2f2;
    }
    body { background: linear-gradient(135deg, #f0faf6 0%, #ffffff 100%); min-height: 100vh; margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    .page-wrap { max-width: 800px; margin: 0 auto; padding: 32px 16px; }
    .profile-box { background: var(--white); border: 1px solid var(--gray-200); border-radius: 16px; padding: 20px; margin-bottom: 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .avatar-lg { width: 52px; height: 52px; border-radius: 50%; background: var(--green-light); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: var(--green); }
    .booking-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; margin-bottom: 14px; overflow: hidden; transition: 0.2s; }
    .booking-card:hover { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .booking-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-bottom: 1px solid var(--gray-100); }
    .booking-body { padding: 14px 18px; display: flex; gap: 16px; align-items: center; }
    .booking-icon { width: 48px; height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .booking-info { flex: 1; text-align: left; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .badge-green { background: #dcfce7; color: #15803d; }
    .badge-amber { background: var(--amber-light); color: var(--amber); }
    .badge-red { background: var(--red-light); color: var(--red); }
    .btn-back { display: inline-flex; align-items: center; gap: 8px; background: #1b4332; color: white; padding: 12px 24px; border-radius: 12px; text-decoration: none; font-weight: 700; margin-top: 20px; }
  </style>
</head>
<body>

<div class="page-wrap">
  <div class="profile-box">
    <div class="avatar-lg">AR</div>
    <div style="flex: 1; text-align: left;">
      <p style="font-weight:700; margin:0;">Andi Rahmawan</p>
      <p style="font-size:13px; color:var(--gray-400); margin:0;">andi.rahmawan@email.com</p>
    </div>
    <a href="index.html" style="text-decoration:none;"><button style="background:var(--green); color:white; border:none; padding:8px 16px; border-radius:8px; font-weight:600; cursor:pointer;">+ Booking Baru</button></a>
  </div>

  <h1 style="font-size:20px; margin-bottom:4px; text-align: left;">Riwayat Booking</h1>
  <p style="font-size:13px; color:var(--gray-400); text-align: left; margin-bottom:24px;">Urutan otomatis: Tanggal hari ini di posisi paling atas</p>

  <div id="booking-list"></div>

  <a href="index.html" class="btn-back"><i class="ti ti-arrow-left"></i> Kembali</a>
</div>

<script>
  function muatRiwayat() {
    const list = document.getElementById('booking-list');
    const dataUser = JSON.parse(localStorage.getItem('riwayatSport')) || [];
    
    // Mendapatkan tanggal hari ini (format YYYY-MM-DD)
    const today = new Date().toISOString().split('T')[0];
    const yesterday = new Date(Date.now() - 864e5).toISOString().split('T')[0];
    const twoDaysAgo = new Date(Date.now() - 1728e5).toISOString().split('T')[0];

    // DATA SIMULASI SESUAI REQUEST
    const dataSimulasi = [
      { 
        tgl: today, 
        tempat: "Arena Badminton 88", 
        sport: "Badminton", 
        harga: "Rp45.000", 
        status: "Menunggu", 
        badge: "badge-amber", 
        iconSport: "ti-feather", 
        iconStatus: "ti-clock-hour-4" 
      },
      { 
        tgl: today, 
        tempat: "Basket Court Pro", 
        sport: "Basketball", 
        harga: "Rp120.000", 
        status: "Selesai", 
        badge: "badge-green", 
        iconSport: "ti-ball-basketball", 
        iconStatus: "ti-circle-check" 
      },
      { 
        tgl: yesterday, 
        tempat: "GOR Maju Jaya", 
        sport: "Futsal", 
        harga: "Rp80.000", 
        status: "Dibatalkan", 
        badge: "badge-red", 
        iconSport: "ti-ball-football", 
        iconStatus: "ti-x" 
      },
      { 
        tgl: twoDaysAgo, 
        tempat: "GOR Sport Center", 
        sport: "Voli", 
        harga: "Rp70.000", 
        status: "Selesai", 
        badge: "badge-green", 
        iconSport: "ti-ball-volleyball", 
        iconStatus: "ti-circle-check" 
      }
    ];

    // Mapping Data User Baru
    const formattedUser = dataUser.map(item => ({
      tgl: item.tgl,
      tempat: "Booking Baru",
      sport: item.sport,
      harga: "Rp85.000",
      status: "Menunggu",
      badge: "badge-amber",
      iconSport: item.sport.includes("Badminton") ? "ti-feather" : "ti-ball-football",
      iconStatus: "ti-clock-hour-4"
    }));

    // Gabung dan Sort Tanggal (Descending: Terbaru -> Terlama)
    const totalData = [...formattedUser, ...dataSimulasi].sort((a, b) => new Date(b.tgl) - new Date(a.tgl));

    list.innerHTML = totalData.map((item, index) => `
      <div class="booking-card">
        <div class="booking-header">
          <span style="font-size:11px; color:var(--gray-400); font-weight:600;">#BK-0${300 - index}</span>
          <span class="badge ${item.badge}"><i class="${item.iconStatus}"></i> ${item.status}</span>
        </div>
        <div class="booking-body">
          <div class="booking-icon" style="background:var(--green-light); color:var(--green);">
            <i class="ti ${item.iconSport}"></i>
          </div>
          <div class="booking-info">
            <div class="booking-name" style="font-size:15px; font-weight:700;">${item.tempat}</div>
            <div style="font-size:12px; color:var(--gray-400); margin-top:4px;">
              <i class="ti ti-calendar"></i> ${item.tgl} &nbsp; <i class="ti ti-activity"></i> ${item.sport}
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:16px; font-weight:700; color:var(--gray-900);">${item.harga}</div>
            <div style="font-size:10px; color:var(--green); font-weight:800; margin-top:4px;">SUCCESS</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  window.onload = muatRiwayat;
</script>
</body>
</html>
