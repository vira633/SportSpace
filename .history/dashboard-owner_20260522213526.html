<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css">
</head>
<body>

  <nav class="navbar">
    <a href="#" class="brand">
      <i class="ri-football-fill"></i>
      <span>Sport Center</span>
      <div class="dot"></div>
    </a>

    <div class="nav-action">
      <button class="btn btn-outline">
        <i class="ri-notification-3-line"></i>
      </button>

      <button class="btn btn-primary">
        <i class="ri-user-line"></i>
        Profile
      </button>
    </div>
  </nav>

  <main class="layout">

    <aside class="sidebar">
      <small class="sidebar-title">Menu</small>

      <a class="sidebar-item active">
        <i class="ri-dashboard-line"></i>
        <span>Dashboard</span>
      </a>

      <a class="sidebar-item menu-booking">
        <i class="ri-calendar-line"></i>
        <span>Booking</span>
        <div class="notif">3</div>
      </a>

      <a class="sidebar-item">
        <i class="ri-file-list-3-line"></i>
        <span>Laporan</span>
      </a>

      <a class="sidebar-item">
        <i class="ri-settings-3-line"></i>
        <span>Pengaturan</span>
      </a>
    </aside>

    <section class="content">

      <div class="heading">
        <h1>Dashboard</h1>
        <p>Kelola data dan booking lapangan</p>
      </div>

      <div class="alert success">
        <i class="ri-checkbox-circle-fill"></i>
        <span>Data berhasil diperbarui</span>
      </div>

      <div class="stats-grid">

        <div class="card stat-card">
          <h2>124</h2>
          <p>Total Booking</p>
          <span class="up">
            <i class="ri-arrow-up-line"></i>
            +12%
          </span>
        </div>

        <div class="card stat-card">
          <h2>Rp12jt</h2>
          <p>Pendapatan</p>
          <span class="up">
            <i class="ri-arrow-up-line"></i>
            +8%
          </span>
        </div>

        <div class="card stat-card">
          <h2>18</h2>
          <p>Lapangan Aktif</p>
          <span class="down">
            <i class="ri-arrow-down-line"></i>
            -2%
          </span>
        </div>

      </div>

      <div class="card">

        <div class="card-head">
          <h3>Data Booking</h3>

          <button class="btn btn-primary btn-sm">
            <i class="ri-add-line"></i>
            Tambah
          </button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Nama</th>
                <th>Lapangan</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>

            <tbody>
              <tr>
                <td>Riska</td>
                <td>Futsal A</td>
                <td><span class="badge green">Selesai</span></td>
                <td>
                  <button class="btn btn-outline btn-sm">Edit</button>
                </td>
              </tr>

              <tr>
                <td>Andi</td>
                <td>Badminton B</td>
                <td><span class="badge amber">Pending</span></td>
                <td>
                  <button class="btn btn-danger btn-sm">Hapus</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

    </section>
  </main>

</body>
</html>
