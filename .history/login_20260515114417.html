<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk / Daftar — SportSpace</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; font-family: 'Plus Jakarta Sans', sans-serif; }
    .auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 32px 16px; background: linear-gradient(135deg, #f0faf6 0%, #e8f5f0 100%); }
    .auth-card { width: 100%; max-width: 420px; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); overflow: hidden; }
    .auth-top { padding: 28px 28px 0; text-align: center; }
    .auth-logo { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 6px; font-weight: 800; font-size: 22px; color: #111827; }
    .auth-logo i { color: #10b981; }
    .auth-desc { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    
    .tab-row { display: flex; border-bottom: 1px solid #e5e7eb; }
    .tab-btn { flex: 1; padding: 14px; font-size: 14px; font-weight: 600; border: none; background: transparent; color: #9ca3af; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
    .tab-btn.active { color: #10b981; border-bottom-color: #10b981; }
    
    .tab-panel { display: none; padding: 24px 28px 28px; }
    .tab-panel.active { display: block; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #374151; }
    .input-icon { position: relative; display: flex; align-items: center; }
    .input-icon i { position: absolute; left: 12px; color: #9ca3af; }
    .form-input { width: 100%; padding: 10px 12px 10px 38px; border: 1.5px solid #e5e7eb; border-radius: 8px; outline: none; transition: 0.2s; }
    .form-input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
    
    .btn { cursor: pointer; font-weight: 700; border: none; transition: 0.2s; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: #10b981; color: white; }
    .btn-primary:hover { background: #059669; }
    .btn-outline { background: white; border: 1.5px solid #e5e7eb; color: #374151; }
    .btn-outline:hover { background: #f9fafb; border-color: #d1d5db; }
    .btn-full { width: 100%; padding: 12px; }
    
    .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #9ca3af; font-size: 12px; }
    .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #e5e7eb; }
    .divider:not(:empty)::before { margin-right: 10px; }
    .divider:not(:empty)::after { margin-left: 10px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-top">
      <div class="auth-logo"><i class="ti ti-tournament"></i> SportSpace</div>
      <p class="auth-desc">Platform booking lapangan olahraga #1 di Yogyakarta</p>
    </div>

    <div class="tab-row">
      <button class="tab-btn active" id="btn-login" onclick="switchTab('login')">Masuk</button>
      <button class="tab-btn" id="btn-register" onclick="switchTab('register')">Daftar</button>
    </div>

    <div class="tab-panel active" id="panel-login">
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-icon">
          <i class="ti ti-mail"></i>
          <input type="email" id="loginEmail" class="form-input" placeholder="email@kamu.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon">
          <i class="ti ti-lock"></i>
          <input type="password" id="loginPass" class="form-input" placeholder="••••••••">
        </div>
      </div>
      
      <button class="btn btn-primary btn-full" onclick="handleLogin()">Masuk <i class="ti ti-arrow-right"></i></button>
      
      <div class="divider"><span>atau masuk sebagai</span></div>
      
      <div style="display:flex; gap:8px;">
        <button class="btn btn-outline btn-full" onclick="goTo('dashboard-admin.html')"><i class="ti ti-shield"></i> Admin</button>
        <button class="btn btn-outline btn-full" onclick="goTo('dashboard-owner.html')"><i class="ti ti-building"></i> Pemilik GOR</button>
      </div>
    </div>

    <div class="tab-panel" id="panel-register">
      <div class="form-group">
        <label class="form-label">Nama lengkap</label>
        <div class="input-icon">
          <i class="ti ti-user"></i>
          <input type="text" id="regNama" class="form-input" placeholder="Nama kamu">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <div class="input-icon">
          <i class="ti ti-mail"></i>
          <input type="email" id="regEmail" class="form-input" placeholder="email@kamu.com">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-icon">
          <i class="ti ti-lock"></i>
          <input type="password" id="regPass" class="form-input" placeholder="Min. 8 karakter">
        </div>
      </div>
      <button class="btn btn-primary btn-full" onclick="handleRegister()">Buat akun <i class="ti ti-arrow-right"></i></button>
    </div>
  </div>
</div>

<script>
  function switchTab(type) {
    const pLogin = document.getElementById('panel-login');
    const pRegister = document.getElementById('panel-register');
    const bLogin = document.getElementById('btn-login');
    const bRegister = document.getElementById('btn-register');

    if (type === 'login') {
      pLogin.classList.add('active');
      pRegister.classList.remove('active');
      bLogin.classList.add('active');
      bRegister.classList.remove('active');
    } else {
      pLogin.classList.remove('active');
      pRegister.classList.add('active');
      bLogin.classList.remove('active');
      bRegister.classList.add('active');
    }
  }
  
  function goTo(url) {
    window.location.href = url;
  }
  
  function handleLogin() {
    const email = document.getElementById('loginEmail').value;
    if(!email) {
      alert("Masukkan email dulu!");
      return;
    }
    localStorage.setItem('userLoggedIn', email);
    window.location.href = "index.html"; 
  }
  
  function handleRegister() {
    const nama = document.getElementById('regNama').value;
    if(!nama) {
      alert("Isi nama lengkap kamu!");
      return;
    }
    alert("Akun berhasil dibuat, Halo " + nama + "!");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
