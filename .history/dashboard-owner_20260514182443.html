<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pemilik GOR — SportSpace</title>
    <link rel="stylesheet" href="owner.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
    <style>
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 28px; }
        .field-row { background: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; }
        .field-row-icon { width: 40px; height: 40px; min-width: 40px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
        .toggle input[type=checkbox] { width: 36px; height: 20px; appearance: none; background: var(--gray-200); border-radius: 20px; cursor: pointer; position: relative; transition: background .2s; }
        .toggle input[type=checkbox]:checked { background: var(--green); }
        .toggle input[type=checkbox]::after { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: left .2s; }
        .toggle input[type=checkbox]:checked::after { left: 18px; }
        .page-title { font-size: 22px; margin-bottom: 4px; font-weight: 700; }
        .page-sub { font-size: 13px; color: var(--gray-400); margin-bottom: 24px; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 999; align-items: center; justify-content: center; padding: 16px; backdrop-filter: blur(4px); }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #fff; border-radius: var(--radius-xl); padding: 28px; max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow); }
    </style>
</head>
<body>
    <script>
        // Fungsi untuk berpindah menu tanpa reload
        function showSection(name, item) {
            // Sembunyikan semua section
            const sections = ['dashboard', 'lapangan', 'booking', 'jadwal', 'profil'];
            sections.forEach(s => {
                document.getElementById('section-' + s).style.display = 'none';
            });
            
            // Tampilkan yang dipilih
            document.getElementById('section-' + name).style.display = 'block';
            
            // Atur class active pada sidebar
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            item.classList.add('active');
        }

        // Fungsi Simulasi Konfirmasi
        function confirmBooking(btn) {
            if(confirm('Konfirmasi booking ini?')) {
                const td = btn.closest('td');
                td.innerHTML = '<span class="badge badge-green"><i class="ti ti-check"></i> Dikonfirmasi</span>';
            }
        }

        // Fungsi Simulasi Tolak
        function rejectBooking(btn) {
            if(confirm('Tolak booking ini?')) {
                const td = btn.closest('td');
                td.innerHTML = '<span class="badge badge-red"><i class="ti ti-x"></i> Ditolak</span>';
            }
        }

        // Close modal jika klik di luar area modal
        window.onclick = function(event) {
            const modal = document.getElementById('add-modal');
            if (event.target == modal) {
                modal.classList.remove('show');
            }
        }
    </script>
</body>
</html>
