<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SportSpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="auth-wrap">

    <div class="auth-card">

        <div class="auth-top">
            <div class="auth-logo">
                <i class="ti ti-tournament"></i>
                SportSpace
            </div>

            <p class="auth-desc">
                Platform booking lapangan olahraga #1 di Yogyakarta
            </p>
        </div>

        <div class="tab-row">
            <button class="tab-btn active" id="btn-login">Masuk</button>
            <button class="tab-btn" id="btn-register">Daftar</button>
        </div>

        <div class="tab-panel active" id="panel-login">

            <div class="form-group">
                <label>Email</label>
                <div class="input-icon">
                    <i class="ti ti-mail"></i>
                    <input type="email" placeholder="email@kamu.com">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-icon">
                    <i class="ti ti-lock"></i>
                    <input type="password" placeholder="••••••••">
                </div>
            </div>

            <button class="btn btn-primary btn-full">
                Masuk
                <i class="ti ti-arrow-right"></i>
            </button>

            <div class="divider">
                <span>atau masuk sebagai</span>
            </div>

            <div class="role-buttons">
                <button class="btn btn-outline">
                    <i class="ti ti-shield"></i>
                    Admin
                </button>

                <button class="btn btn-outline">
                    <i class="ti ti-building"></i>
                    Pemilik GOR
                </button>
            </div>

        </div>

        <div class="tab-panel" id="panel-register">

            <div class="form-group">
                <label>Nama Lengkap</label>
                <div class="input-icon">
                    <i class="ti ti-user"></i>
                    <input type="text" placeholder="Nama kamu">
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-icon">
                    <i class="ti ti-mail"></i>
                    <input type="email" placeholder="email@kamu.com">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-icon">
                    <i class="ti ti-lock"></i>
                    <input type="password" placeholder="Minimal 8 karakter">
                </div>
            </div>

            <button class="btn btn-primary btn-full">
                Buat Akun
                <i class="ti ti-arrow-right"></i>
            </button>

        </div>

    </div>

</div>

<script>
const loginBtn = document.getElementById("btn-login");
const registerBtn = document.getElementById("btn-register");

const loginPanel = document.getElementById("panel-login");
const registerPanel = document.getElementById("panel-register");

loginBtn.addEventListener("click", () => {
    loginBtn.classList.add("active");
    registerBtn.classList.remove("active");

    loginPanel.classList.add("active");
    registerPanel.classList.remove("active");
});

registerBtn.addEventListener("click", () => {
    registerBtn.classList.add("active");
    loginBtn.classList.remove("active");

    registerPanel.classList.add("active");
    loginPanel.classList.remove("active");
});
</script>

</body>
</html>
