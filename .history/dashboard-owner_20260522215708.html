# owner.html (versi dirapikan)

```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Pemilik GOR — SportSpace</title>

  <link rel="stylesheet" href="owner.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar-brand">
    <i class="ti ti-bowling"></i>
    <span>SportSpace</span>
    <div class="dot"></div>
  </a>

  <a href="login.html">
    <button class="btn btn-outline btn-sm">
      <i class="ti ti-logout"></i>
      Keluar
    </button>
  </a>
</nav>

<div class="dashboard-layout">

  <aside class="sidebar">
    <div class="sidebar-section">Menu</div>

    <div class="sidebar-item active" onclick="showSection('dashboard',this)">
      <i class="ti ti-home"></i>Dashboard
    </div>

    <div class="sidebar-item" onclick="showSection('lapangan',this)">
      <i class="ti ti-layout-grid"></i>Lapangan Saya
    </div>

    <div class="sidebar-item menu-booking" onclick="showSection('booking',this)">
      <i class="ti ti-calendar"></i>
      Booking Masuk
      <span class="notif-badge">3</span>
    </div>

    <div class="sidebar-item" onclick="showSection('jadwal',this)">
      <i class="ti ti-clock"></i>Kelola Jadwal
    </div>

    <div class="sidebar-section">Lainnya</div>

    <div class="sidebar-item" onclick="showSection('profil',this)">
      <i class="ti ti-building"></i>Profil GOR
    </div>

    <a href="login.html" class="logout-link">
      <div class="sidebar-item logout-item">
        <i class="ti ti-logout"></i>Keluar
      </div>
    </a>
  </aside>

  <main class="dashboard-content">

    <div id="section-dashboard">
      <h1 class="page-title">Dashboard Owner</h1>

      <div class="stats-grid">

        <div class="stat-card">
          <div class="flex-between start">
            <div>
              <div class="stat-value">8</div>
              <div class="stat-label">Booking Hari Ini</div>
            </div>

            <div class="icon-box green-light">
              <i class="ti ti-calendar-check green"></i>
            </div>
          </div>

          <div class="stat-change stat-up">
            <i class="ti ti-trending-up"></i>
            +2 dari kemarin
          </div>
        </div>

        <div class="stat-card">
          <div class="flex-between start">
            <div>
              <div class="stat-value">3</div>
              <div class="stat-label">Menunggu Konfirmasi</div>
            </div>

            <div class="icon-box amber-light">
              <i class="ti ti-clock amber"></i>
            </div>
          </div>

          <div class="stat-change amber-text">
            <i class="ti ti-alert-circle"></i>
            Perlu konfirmasi segera
          </div>
        </div>

      </div>
    </div>

  </main>
</div>

<script>
function showSection(name,item){
  document.querySelectorAll('[id^="section-"]').forEach(s=>s.style.display='none')
  document.getElementById('section-'+name).style.display='block'

  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'))
  item.classList.add('active')
}

const bookingMenu=document.querySelector('.menu-booking')
const notifBadge=document.querySelector('.notif-badge')

bookingMenu.addEventListener('click',()=>{
  notifBadge.style.display='none'
})
</script>

</body>
</html>
