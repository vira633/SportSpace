<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SportSpace</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<div class="auth-wrap">

    <div class="auth-card">

        <div class="auth-top">
            <div class="auth-logo">
                <i class="ti ti-shield"></i>
                Admin SportSpace
            </div>

            <p class="auth-desc">
                Masuk ke halaman kontrol panel admin
            </p>
        </div>

        <!-- PANEL LOGIN -->
        <div class="tab-panel active" id="panel-login">

            <form id="form-login">

                <div class="form-group">
                    <label>Email Admin</label>
                    <div class="input-icon">
                        <i class="ti ti-mail"></i>
                        <input type="email" name="email" id="loginEmail" placeholder="admin@sportspace.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-icon">
                        <i class="ti ti-lock"></i>
                        <input type="password" name="password" id="loginPassword" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Pesan error login -->
                <div id="error-login" style="color:red;font-size:13px;margin-bottom:10px;display:none;"></div>

                <button type="submit" class="btn btn-primary btn-full">
                    Masuk sebagai Admin
                    <i class="ti ti-arrow-right"></i>
                </button>

            </form>

            <div class="divider">
                <span>atau</span>
            </div>

            <div class="role-buttons">
                <button type="button" class="btn btn-outline" onclick="window.location.href='login.html'" style="width: 100%;">
                    <i class="ti ti-arrow-left"></i>
                    Kembali ke Login User
                </button>
            </div>

        </div>

    </div>

</div>

<script>
// ── Form Login Admin ────────────────────────────────────
document.getElementById('form-login').addEventListener('submit', function(e) {
    e.preventDefault();

    const email    = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('error-login');

    errorDiv.style.display = 'none';

    fetch('login.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            window.location.href = data.redirect;
        } else {
            errorDiv.style.display = 'block';
            errorDiv.textContent = data.message;
        }
    })
    .catch(() => {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Terjadi kesalahan, coba lagi.';
    });
});
</script>

</body>
</html>
